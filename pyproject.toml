[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonu"
version = "0.1.0"
description = "SONU: Sketched Orthonormalized Updates"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3"]

[project.optional-dependencies]
train = ["transformers==4.56.0", "datasets==4.0.0", "accelerate==1.10.1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sonu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
